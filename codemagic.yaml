workflows:
  ios-app-store:
    name: Crater Hoard — App Store preparation
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: craterhoard
    environment:
      groups:
        - craterhoard_asc
      xcode: 27.1
      vars:
        XCODE_PROJECT: CraterHoard.xcodeproj
        XCODE_SCHEME: CraterHoard
        BUNDLE_ID: com.craterhoard.game41
        APP_STORE_APP_ID: "6830249258"
    scripts:
      - name: Set up code signing
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set unique build number
        script: |
          agvtool new-version -all "$((PROJECT_BUILD_NUMBER + 1))"
      - name: Archive and export IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
